name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
      - name: Build and push backend image
        run: |
          VERSION=${GITHUB_REF_NAME}
          docker build -t ghcr.io/${{ github.repository_owner }}/civicpulse-backend:${VERSION} ./backend
          docker push ghcr.io/${{ github.repository_owner }}/civicpulse-backend:${VERSION}
      - name: Build and push frontend image
        run: |
          VERSION=${GITHUB_REF_NAME}
          docker build -t ghcr.io/${{ github.repository_owner }}/civicpulse-frontend:${VERSION} ./frontend
          docker push ghcr.io/${{ github.repository_owner }}/civicpulse-frontend:${VERSION}
      - name: Generate release notes
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
