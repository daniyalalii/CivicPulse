name: CI Pipeline

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - main

jobs:
  lint-and-type:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy pydantic pydantic-settings sqlalchemy asyncpg alembic redis openai httpx prometheus-client python-json-logger pytest pytest-asyncio pytest-cov fakeredis
      - name: Run Ruff
        run: ruff check app
      - name: Run Mypy
        run: mypy app

  test-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: civicpulse
          POSTGRES_PASSWORD: civicpulse_password
          POSTGRES_DB: civicpulse
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        if: hashFiles('backend/requirements.txt') != ''
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run Alembic migrations
        if: hashFiles('backend/requirements.txt') != ''
        env:
          DATABASE_URL: postgresql+asyncpg://civicpulse:civicpulse_password@localhost:5432/civicpulse
          REDIS_URL: redis://localhost:6379/0
          TRIAGE_PROVIDER: simulated
        run: alembic upgrade head
      - name: Run Pytest
        if: hashFiles('backend/requirements.txt') != ''
        env:
          DATABASE_URL: postgresql+asyncpg://civicpulse:civicpulse_password@localhost:5432/civicpulse
          REDIS_URL: redis://localhost:6379/0
          TRIAGE_PROVIDER: simulated
        run: pytest --cov=app --cov-fail-under=65 tests/
