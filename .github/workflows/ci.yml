name: CI

on:
  push:
    branches: [main, dev, feat/dockub, feat/ci-pipeline]
  pull_request:
    branches: [main, dev, feat/ci-pipeline]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

jobs:
  lint-and-type:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend lint dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt ruff mypy
      - name: Lint backend
        run: ruff check backend/app
      - name: Type check backend
        run: mypy backend/app --config-file backend/pyproject.toml
      - name: Frontend install if present
        if: hashFiles('frontend/package.json') != ''
        run: npm ci --prefix frontend
      - name: Frontend lint/typecheck if present
        if: hashFiles('frontend/package.json') != ''
        run: |
          npm --prefix frontend run lint -- --max-warnings=0
          npm --prefix frontend run typecheck

  test-backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: civicpulse
          POSTGRES_PASSWORD: civicpulse
          POSTGRES_DB: civicpulse
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U civicpulse -d civicpulse"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://civicpulse:civicpulse@localhost:5432/civicpulse
      REDIS_URL: redis://localhost:6379/0
      TRIAGE_PROVIDER: simulated
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend deps
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
      - name: Run Alembic migrations
        run: cd backend && alembic upgrade head
      - name: Run backend tests with coverage
        run: cd backend && pytest --cov=app --cov-fail-under=65 tests/

  test-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install frontend deps
        run: npm ci --prefix frontend
      - name: Run frontend tests
        run: npm --prefix frontend run test -- --run

  build:
    runs-on: ubuntu-latest
    needs: [lint-and-type, test-backend]
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -t civicpulse-backend:test ./backend
      - name: Build frontend image
        if: hashFiles('frontend/package.json') != ''
        run: docker build -t civicpulse-frontend:test ./frontend

  scan:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - name: Install Trivy
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin v0.63.0
      - name: Scan backend image
        run: trivy image --severity HIGH,CRITICAL --exit-code 1 civicpulse-backend:test
      - name: Scan frontend image
        if: hashFiles('frontend/package.json') != ''
        run: trivy image --severity HIGH,CRITICAL --exit-code 1 civicpulse-frontend:test

  manifests:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - name: Install kubeconform
        run: |
          curl -fsSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar xz -C /tmp
          sudo install /tmp/kubeconform /usr/local/bin/
      - name: Validate Kustomize output
        run: |
          kubectl kustomize k8s/overlays/dev > /tmp/dev.yaml
          kubeconform -strict -summary /tmp/dev.yaml

  integration:
    runs-on: ubuntu-latest
    needs: [manifests, scan]
    steps:
      - uses: actions/checkout@v4
      - name: Compose up
        run: docker compose up -d --build
      - name: Wait for backend readiness
        run: |
          for i in {1..30}; do
            curl -fsS http://localhost:8000/ready && break
            sleep 5
          done
      - name: POST complaint and GET stats
        run: |
          curl -fsS -X POST http://localhost:8000/api/complaints \
            -H 'Content-Type: application/json' \
            -d '{"text":"Water pipe burst near the market and water is entering shops.","location":"G-9 Markaz","reporter_contact":"0300-1234567"}'
          curl -fsS -D - http://localhost:8000/api/stats | tee /tmp/stats.txt
          grep -E 'X-Cache: (HIT|MISS)' /tmp/stats.txt
      - name: Tear down compose stack
        if: always()
        run: docker compose down -v
